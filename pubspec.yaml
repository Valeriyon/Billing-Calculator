name: billing_app_pos
description: "A fast, offline-first store billing app with calculator-style UI for elder-friendly daily use."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  
  # Database
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.21
  
  # Navigation
  go_router: ^14.2.0
  
  # Export
  pdf: ^3.10.8
  printing: ^5.14.2
  excel: ^4.0.3
  path_provider: ^2.1.3
  share_plus: ^12.0.1
  image_picker: ^1.1.2
  mobile_scanner: ^5.2.3
  audioplayers: ^6.1.0
  
  # Localization
  intl: ^0.20.2
  
  # Utils
  shared_preferences: ^2.2.3
  path: ^1.9.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/sounds/
